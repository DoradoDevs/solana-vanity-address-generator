name: test

on:
  push:
  pull_request:

# Read-only token, no secrets: a pull request from a fork gets nothing to misuse.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22, as Netlify builds with (netlify.toml NODE_VERSION, web/.node-version).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cli/package-lock.json

      - name: Install (web)
        working-directory: web
        run: npm ci
      - name: Test (web)
        working-directory: web
        run: npm test
      - name: Build (web)
        working-directory: web
        run: npm run build

      - name: Install (cli)
        working-directory: cli
        run: npm ci
      - name: Test (cli)
        working-directory: cli
        run: npm test
