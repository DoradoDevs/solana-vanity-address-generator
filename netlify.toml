# When the site base directory is web, Netlify reads web/netlify.toml
# first and ignores [functions] in this root file. The same [functions]
# block is repeated there so esbuild applies either way.
# Paths in this file are relative to the base directory.

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public receive address. The Netlify UI can override this.
  # Do not put SOLANA_RPC_URL or UNLOCK_SECRET in this file.
  PAY_TO_ADDRESS = "crimeKXXM4ERRWcHZvetHPTz9BwoWYyfYzNjzD4THCp"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # esbuild follows this import, and the zip step must be allowed to see
  # shared/ which lives outside the web/ base directory.
  included_files = ["../shared/**"]

[dev]
  command = "npm run dev -- --host 127.0.0.1 --port 5173 --strictPort"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; style-src 'self' 'sha256-rtlpYQDea8CghSWj+10cTMv5JN4Mdo1uYlXysAcWC/k='; font-src 'self'; img-src 'self' data:; connect-src https://vanitygrinder.com/.netlify/functions/ https://*.netlify.app/.netlify/functions/ http://localhost:8888/.netlify/functions/ http://127.0.0.1:8888/.netlify/functions/; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'none'; base-uri 'self'"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; style-src 'self' 'sha256-rtlpYQDea8CghSWj+10cTMv5JN4Mdo1uYlXysAcWC/k='; font-src 'self'; img-src 'self' data:; connect-src https://vanitygrinder.com/.netlify/functions/ https://*.netlify.app/.netlify/functions/ http://localhost:8888/.netlify/functions/ http://127.0.0.1:8888/.netlify/functions/; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'none'; base-uri 'self'"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
