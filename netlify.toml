# Base directory is web/. Paths below are relative to it.
# https://docs.netlify.com/configure-builds/overview/

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public receive address. The Netlify UI can override this.
  # Do not put SOLANA_RPC_URL or UNLOCK_SECRET in this file.
  PAY_TO_ADDRESS = "crimeKXXM4ERRWcHZvetHPTz9BwoWYyfYzNjzD4THCp"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev -- --host 127.0.0.1 --port 5173 --strictPort"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src https://vanitygrinder.com/.netlify/functions/ https://*.netlify.app/.netlify/functions/ http://localhost:8888/.netlify/functions/ http://127.0.0.1:8888/.netlify/functions/; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'none'; base-uri 'self'"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src https://vanitygrinder.com/.netlify/functions/ https://*.netlify.app/.netlify/functions/ http://localhost:8888/.netlify/functions/ http://127.0.0.1:8888/.netlify/functions/; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'none'; base-uri 'self'"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
