# Netlify reads one netlify.toml: web/netlify.toml when the site's base
# directory is web, otherwise this one. The two are kept identical apart
# from `base` (web/test/privacy.test.js checks it), so the result is the
# same whichever is read. Paths are relative to the base directory.

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Build-time only. Functions never see variables set in this file, so no
  # payment setting belongs here: the payee is DEFAULT_PAY_TO in
  # web/netlify/functions/lib/constants.js unless PAY_TO_ADDRESS is set in the
  # Netlify UI, and SOLANA_RPC_URL and UNLOCK_SECRET exist only in the UI.

[functions]
  directory = "netlify/functions"
  # These functions use the current API (a default export). Netlify bundles
  # those with its file tracer whatever node_bundler says: local imports,
  # shared/ included, are inlined and node_modules are traced. The two
  # settings below do not change that; they are left as they were deployed.
  node_bundler = "esbuild"
  included_files = ["../shared/**"]

[dev]
  command = "npm run dev -- --host 127.0.0.1 --port 5173 --strictPort"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = false

# Response headers are not set here. The build writes dist/_headers from
# web/src/headers.js, and Netlify reads that file from the publish directory.
